name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv, as setup.sh and the conventions use, from the committed uv.lock: the
      # cache keeps a warm run to seconds, and --locked fails when pyproject.toml
      # and the lock disagree instead of resolving something else.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --no-sync ruff check src tests examples

      # The examples are type-checked too: hooks.py is docs/SPEC.md executable,
      # and an example that teaches the wrong type teaches it to everyone.
      - name: Type check
        run: uv run --no-sync mypy src/chatinho examples

      - name: Test
        run: uv run --no-sync pytest -q

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@~1.13

      - name: Validate specs and changes
        env:
          OPENSPEC_TELEMETRY: "0"
        run: openspec validate --all --strict --no-interactive
