schema: spec-driven

context: |
  All artifacts must be written in English.
  chatinho is a Python 3.12+ chat library (see CLAUDE.md): a stdlib-only core
  (session, hooks, message, query) and batteries behind extras.
  Code conventions: typing.List/Optional/Dict, never PEP 585/604 builtins; no
  `from __future__ import annotations`; %-style logging args; align `:` and `=`
  in related blocks; Google-style docstrings; catch specific exceptions.
  Checks, all from the repo root: `ruff check src tests examples`,
  `mypy src/chatinho examples`, `pytest -q`; a pyproject.toml change needs
  `uv lock` beside it.
  A bug fix starts with a test that fails on the current code. When behaviour
  changes, update CLAUDE.md and docs/SPEC.md in the same task.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
