[project]
name = "chatinho"
version = "0.1.0"
description = "An extensible chat library: peers, three verbs, ten hooks — with an optional Textual TUI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Mcking", email = "mcking@openclaw.ai"}
]
keywords = ["chat", "tui", "terminal", "textual", "messaging", "repl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Terminals",
    "Typing :: Typed",
]
# The core — ChatSession, the hooks, the commands — imports nothing but the
# standard library, and tests/test_architecture.py fails if that stops being
# true. Each battery brings its own dependency, so a project that embeds the
# session in a service does not install a terminal, and one that wants the
# terminal does not install OpenAI's client.
dependencies = []

[project.urls]
Homepage = "https://github.com/lcmonteiro/chatinho"
Repository = "https://github.com/lcmonteiro/chatinho"

[project.optional-dependencies]
# What most people want: the terminal app that create_chat builds.
tui = ["textual>=0.45.0"]
# One per battery, named after what it gives you.
openai = ["openai>=1.0.0"]
a2a    = ["requests>=2.25.0"]
sql    = ["sqlalchemy>=2.0.0"]
all    = ["textual>=0.45.0", "openai>=1.0.0", "requests>=2.25.0", "sqlalchemy>=2.0.0"]
dev = [
    "textual>=0.45.0",
    "openai>=1.0.0",
    "requests>=2.25.0",
    "sqlalchemy>=2.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chatinho*"]

[tool.setuptools.package-data]
chatinho = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every participant is a coroutine now, so every test that drives one is too.
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
# The codebase aligns field/annotation colons for readability; don't
# auto-reformat (E203-adjacent whitespace) since `ruff format` would fight it.
ignore = ["E203", "E221"]

[tool.mypy]
python_version = "3.12"
packages = ["chatinho"]
ignore_missing_imports = true
